name: vlille
version: "0.1.0"
profile: vlille

flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

vars:
  # Raw tables require a partition filter: staging reads from this date.
  start_date: "2026-10-01"
  # Business rule: empty (or full) on at least this share of the day's reports.
  rebalancing_threshold: 0.2

models:
  vlille:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
