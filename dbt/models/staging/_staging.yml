version: 2

models:
  - name: stg_station_status
    description: >
      Disponibilité des stations, une ligne par message Kafka (doublons possibles, garantie au moins
      une fois).
    columns:
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_station_information')
                field: station_id
      - name: num_bikes_available
        data_tests:
          - not_null
      - name: num_docks_available
        data_tests:
          - not_null
      - name: last_reported_at
        description: Dernière remontée d'information de la station (peut être antérieure au relevé).
        data_tests:
          - not_null
      - name: feed_updated_at
        description: Horodatage du relevé qui a fourni l'information (last_updated du flux).
        data_tests:
          - not_null
      - name: ingestion_date
        description: Jour d'écriture du message dans la zone brute (partition de la table brute).

  - name: stg_station_information
    description: Référentiel des stations à chaque relevé du flux station_information.
    columns:
      - name: station_id
        data_tests:
          - not_null
      - name: station_name
        data_tests:
          - not_null
      - name: capacity
        data_tests:
          - not_null
      - name: feed_updated_at
        data_tests:
          - not_null
