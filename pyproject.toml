[project]
name = "vlille-pipeline"
version = "0.1.0"
description = "Pipeline de données sur la disponibilité des stations V'Lille (projet personnel d'apprentissage)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-storage>=3.16.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
vlille-collect = "vlille.collect:main"
vlille-load = "vlille.load:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlille"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
