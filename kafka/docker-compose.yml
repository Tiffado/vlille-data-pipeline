# Single-node Kafka in KRaft mode (no ZooKeeper, no replication), plus the project's producer and
# consumer. From the repository root: docker compose -f kafka/docker-compose.yml up -d --build

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for other containers (kafka:19092), EXTERNAL for the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10
    restart: always

  # Creates the topic at startup, then exits.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists
      --topic vlille.station_status --partitions 3 --replication-factor 1

  producer:
    build:
      context: ..
      dockerfile: kafka/Dockerfile
    image: vlille-app:local
    command: vlille-produce
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: always

  consumer:
    image: vlille-app:local
    command: vlille-consume
    env_file:
      - ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # User's GCP Application Default Credentials, read-only.
      GOOGLE_APPLICATION_CREDENTIALS: /opt/gcloud/application_default_credentials.json
    volumes:
      - ${APPDATA}/gcloud/application_default_credentials.json:/opt/gcloud/application_default_credentials.json:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      producer:
        condition: service_started
    restart: always

volumes:
  kafka-data:
